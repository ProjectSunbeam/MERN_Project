<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="cont">
        <div class="title">
            <h1>Register</h1>
        </div>
        <form onsubmit="return validateForm()">
            <div class="fieldTitle">
                <h2>Name</h2>
                <input id="nameip" class="input" type="text" placeholder="Name" required>
            </div>
            <div class="fieldTitle">
                <h2>Email Address</h2>
                <input id="emailip" class="input" type="email" placeholder="Email" required>
            </div>
            <div class="fieldTitle">
                <h2>Password</h2>
                <input id="passip" class="input" type="password" placeholder="Password" required>
            </div>
            <div class="fieldTitle">
                <h2>Phone Number</h2>
                <input id="phoneip" class="input" type="text" placeholder="Phone Number" required>
            </div>
            <div class="login">
                <button id="buttonip" class="log">
                    Register
                </button>
            </div>
        </form>
    </div>

    <script src="register.js"></script>

</body>
</html>
